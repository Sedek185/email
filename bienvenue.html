<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Personnel - To-Do List</title>
<style>
  /* --- BASE & COULEURS DARK MODE --- */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Google Sans', Roboto, Helvetica, Arial, sans-serif;
    background: #0d0e12; /* Fond sombre pro */
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    color: #e2e8f0;
    padding: 40px 20px;
    overflow-x: hidden;
    position: relative;
  }

  /* --- ONDE DE LUMIÈRE BLEUE DISCRÈTE --- */
  .bg-glow {
    position: absolute;
    top: 250px;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    width: 140vmax;
    height: 140vmax;
    background: radial-gradient(circle, rgba(0, 102, 204, 0.15) 0%, rgba(0,0,0,0) 60%);
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
    z-index: 0;
    animation: glowOut 2.5s ease-out forwards;
  }

  @keyframes glowOut {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }

  /* --- STRUCTURE --- */
  .content { 
    position: relative; 
    z-index: 1; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    width: 100%;
    max-width: 550px;
  }

  .icon {
    width: 70px; height: 70px;
    background: rgba(0, 102, 204, 0.15);
    border: 1px solid rgba(0, 102, 204, 0.4);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
    animation: popIn .4s cubic-bezier(.17,.67,.35,1.3) both;
    box-shadow: 0 0 15px rgba(0, 102, 204, 0.2);
  }

  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .icon svg { width: 32px; height: 32px; }

  h1 {
    font-size: 28px; 
    font-weight: 500;
    margin-bottom: 8px;
    color: #38bdf8;
    animation: slideUp .35s ease .1s both;
  }

  p.welcome-text {
    font-size: 14px; 
    opacity: .7; 
    margin-bottom: 35px;
    text-align: center;
    line-height: 1.5;
    animation: slideUp .35s ease .2s both;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* --- BLOC TO-DO LIST --- */
  .todo-container {
    width: 100%;
    background: #14161d;
    border: 1px solid #262936;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    margin-bottom: 35px;
    animation: slideUp .35s ease .25s both;
  }

  /* Zone de saisie */
  .todo-input-group {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .todo-input {
    flex: 1;
    height: 46px;
    background: #11131a;
    border: 1px solid #262936;
    border-radius: 8px;
    padding: 0 16px;
    color: #f8fafc;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .todo-input:focus {
    border-color: #38bdf8;
  }

  .add-btn {
    height: 46px;
    padding: 0 20px;
    background: #38bdf8;
    color: #0d0e12;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .add-btn:hover { background: #7dd3fc; }
  .add-btn:active { transform: scale(0.95); }

  /* Filtres / Compteur */
  .todo-stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #64748b;
    padding-bottom: 12px;
    border-bottom: 1px solid #262936;
    margin-bottom: 16px;
  }

  /* Liste des tâches */
  .todo-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 320px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .todo-list::-webkit-scrollbar { width: 5px; }
  .todo-list::-webkit-scrollbar-thumb { background: #262936; border-radius: 10px; }

  .todo-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #1a1d29;
    border: 1px solid #262936;
    padding: 12px 16px;
    border-radius: 8px;
    animation: fadeIn 0.2s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .todo-item-left {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
  }

  /* Custom Checkbox */
  .todo-checkbox {
    width: 18px;
    height: 18px;
    border: 2px solid #64748b;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .todo-item.completed .todo-checkbox {
    background: #10b981;
    border-color: #10b981;
  }

  .todo-checkbox svg {
    width: 12px;
    height: 12px;
    fill: none;
    stroke: #0d0e12;
    stroke-width: 3;
    display: none;
  }

  .todo-item.completed .todo-checkbox svg {
    display: block;
  }

  .todo-text {
    font-size: 14px;
    color: #e2e8f0;
    transition: all 0.2s;
    user-select: none;
  }

  .todo-item.completed .todo-text {
    text-decoration: line-through;
    color: #64748b;
  }

  /* Bouton Supprimer */
  .delete-btn {
    background: transparent;
    border: none;
    color: #64748b;
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
    transition: color 0.2s;
  }

  .delete-btn:hover { color: #ef4444; }

  /* --- RETOUR --- */
  .btn-back {
    background: #1a1d29; 
    color: #94a3b8;
    border: 1px solid #262936; 
    border-radius: 6px;
    padding: 0 28px; height: 44px;
    font-size: 14px; font-weight: 500;
    cursor: pointer; font-family: inherit;
    letter-spacing: .25px;
    transition: all 0.2s ease;
    animation: slideUp .35s ease .3s both;
  }
  .btn-back:hover {
    background: #222533;
    color: #f8fafc;
    border-color: #38bdf8;
    box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15);
  }
  .btn-back:active { transform: translateY(1px); }

</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="content">
  
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 13l4 4L19 7" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <h1>Espace Travail</h1>
  <p class="welcome-text">Session connectée. Organisez vos tâches et objectifs de la journée.</p>

  <div class="todo-container">
    
    <div class="todo-input-group">
      <input type="text" id="todo-input" class="todo-input" placeholder="Ajouter une nouvelle tâche..." autocomplete="off">
      <button class="add-btn" onclick="addTodo()">Ajouter</button>
    </div>

    <div class="todo-stats">
      <span id="todo-count">0 tâche restante</span>
      <span style="cursor:pointer; color:#38bdf8;" onclick="clearCompleted()">Nettoyer terminées</span>
    </div>

    <ul class="todo-list" id="todo-list">
      </ul>

  </div>

  <button class="btn-back" onclick="window.location.href='connexion.html'">
    ← Retour à la connexion
  </button>
</div>

<script>
  // Tableau de stockage des tâches en mémoire
  let todos = [
    { id: 1, text: "Finaliser la structure du projet", completed: false },
    { id: 2, text: "Vérifier la configuration réseau", completed: true },
    { id: 3, text: "Optimiser les requêtes de la base de données", completed: false }
  ];

  // Initialisation au chargement de la page
  window.onload = function() {
    renderTodos();
  };

  // Permet de gérer l'ajout avec la touche Entrée
  document.getElementById('todo-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      addTodo();
    }
  });

  // Fonction pour afficher graphiquement la liste
  function renderTodos() {
    const list = document.getElementById('todo-list');
    list.innerHTML = '';

    if (todos.length === 0) {
      list.innerHTML = `<li style="text-align:center; padding: 20px; opacity:0.4; font-size:14px; list-style:none;">Aucune tâche pour le moment.</li>`;
      updateStats();
      return;
    }

    todos.forEach(todo => {
      const li = document.createElement('li');
      li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
      
      li.innerHTML = `
        <div class="todo-item-left" onclick="toggleTodo(${todo.id})">
          <div class="todo-checkbox">
            <svg viewBox="0 0 24 24"><path d="M19 6L9 16l-4-4" stroke="white" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <span class="todo-text">${todo.text}</span>
        </div>
        <button class="delete-btn" onclick="deleteTodo(${todo.id})">&times;</button>
      `;
      
      list.appendChild(li);
    });

    updateStats();
  }

  // Ajouter une tâche
  function addTodo() {
    const input = document.getElementById('todo-input');
    const text = input.value.trim();
    
    if (text === '') return;

    todos.push({
      id: Date.now(),
      text: text,
      completed: false
    });

    input.value = '';
    renderTodos();
  }

  // Cocher / Décocher une tâche
  function toggleTodo(id) {
    todos = todos.map(todo => {
      if (todo.id === id) {
        return { ...todo, completed: !todo.completed };
      }
      return todo;
    });
    renderTodos();
  }

  // Supprimer une tâche
  function deleteTodo(id) {
    todos = todos.filter(todo => todo.id !== id);
    renderTodos();
  }

  // Supprimer toutes les tâches cochées d'un coup
  function clearCompleted() {
    todos = todos.filter(todo => !todo.completed);
    renderTodos();
  }

  // Mettre à jour le compteur dynamique
  function updateStats() {
    const activeCount = todos.filter(todo => !todo.completed).length;
    const countSpan = document.getElementById('todo-count');
    
    if (activeCount <= 1) {
      countSpan.innerText = `${activeCount} tâche restante`;
    } else {
      countSpan.innerText = `${activeCount} tâches restantes`;
    }
  }
</script>
</body>
</html>
