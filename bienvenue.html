<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion réussie</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Google Sans', Roboto, Arial, sans-serif;
    background: #c0392b;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
  }

  .icon {
    width: 80px; height: 80px;
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 32px;
    animation: popIn .4s cubic-bezier(.17,.67,.35,1.3);
  }

  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .icon svg { width: 40px; height: 40px; }

  h1 {
    font-size: 32px; font-weight: 400;
    margin-bottom: 12px;
    animation: slideUp .35s ease .1s both;
  }

  p {
    font-size: 16px; opacity: .85; margin-bottom: 40px;
    text-align: center; max-width: 320px; line-height: 1.6;
    animation: slideUp .35s ease .2s both;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .btn-back {
    background: white; color: #c0392b;
    border: none; border-radius: 4px;
    padding: 0 32px; height: 44px;
    font-size: 15px; font-weight: 500;
    cursor: pointer; font-family: inherit;
    letter-spacing: .25px;
    transition: box-shadow .2s, transform .1s;
    animation: slideUp .35s ease .3s both;
  }
  .btn-back:hover {
    box-shadow: 0 4px 12px rgba(0,0,0,.25);
    transform: translateY(-1px);
  }
  .btn-back:active { transform: translateY(0); }

  .confetti {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; overflow: hidden; z-index: 0;
  }
  .dot {
    position: absolute; width: 8px; height: 8px; border-radius: 2px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    from { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    to   { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  .content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>

<!-- Confetti dots -->
<div class="confetti" id="confetti"></div>

<div class="content">
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 13l4 4L19 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <h1>Connexion réussie&nbsp;!</h1>
  <p>Vous êtes maintenant connecté à votre compte Google. Bienvenue&nbsp;!</p>

  <button class="btn-back" onclick="window.location.href='connexion.html'">
    ← Retour à la connexion
  </button>
</div>

<script>
  // Generate confetti
  const colors = ['#fff', '#ffcdd2', '#ffeb3b', '#f48fb1', '#ffe082'];
  const c = document.getElementById('confetti');
  for (let i = 0; i < 60; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    d.style.left = Math.random() * 100 + 'vw';
    d.style.top = '-10px';
    d.style.background = colors[Math.floor(Math.random() * colors.length)];
    d.style.animationDuration = (2.5 + Math.random() * 3) + 's';
    d.style.animationDelay = (Math.random() * 2) + 's';
    d.style.width = d.style.height = (5 + Math.random() * 8) + 'px';
    c.appendChild(d);
  }
</script>
</body>
</html>
